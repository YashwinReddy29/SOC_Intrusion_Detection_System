name: build-and-test

on:
  push:
    branches: [ main, production-v3-platform ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python Syntax
      run: |
        python -m py_compile run.py
        python -m compileall -q app ml scripts tests

    - name: Generate ML Model Artifact
      run: |
        PYTHONPATH=. python scripts/run_ml_experiment.py

    - name: Run Automated Tests
      run: |
        PYTHONPATH=. pytest -q

    - name: Basic Import Test
      run: |
        PYTHONPATH=. python -c "from app import create_app; print('App loads successfully')"

    - name: Build Docker Image
      run: docker build -t soc-system .
