name: build-and-test

on:
  push:
    branches: [main, production-v3-platform, production-v3-phase2-incidents, production-v3-phase3-data-recovery, production-v3-phase4-ml-governance, production-v3-phase5-operations, production-v3-phase6-release]
  pull_request:
    branches: [main, production-v3-platform, production-v3-phase2-incidents, production-v3-phase3-data-recovery, production-v3-phase4-ml-governance, production-v3-phase5-operations, production-v3-phase6-release]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m py_compile run.py
          python -m compileall -q app ml scripts tests

      - name: Ruff
        run: ruff check --select E4,E7,E9,F app ml scripts tests run.py

      - name: Bandit high-severity scan
        run: bandit -q -r app ml scripts --severity-level high

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Generate ML Model Artifact
        run: PYTHONPATH=. python scripts/run_ml_experiment.py

      - name: Run Automated Tests
        run: PYTHONPATH=. pytest -q

      - name: Basic Import Test
        run: PYTHONPATH=. python -c "from app import create_app; app=create_app(); print('App loads successfully')"

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build Application Image
        run: docker build -t soc-platform:ci .

  integration:
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_ENV: development
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789
      JWT_SECRET_KEY: ci-jwt-key-0123456789abcdef0123456789
      ML_API_KEY: ci-ingestion-key-0123456789abcdef0123456789
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Start Kafka/PostgreSQL/Redis SOC stack
        run: docker compose up --build -d --wait --wait-timeout 180 app worker

      - name: Kafka ingestion smoke test
        shell: bash
        run: |
          set -e
          payload='{"timestamp":"2026-01-15T12:00:00+00:00","source_ip":"10.10.10.10","destination_ip":"192.0.2.10","source_port":49152,"destination_port":443,"protocol":"HTTPS","bytes_in":1000,"bytes_out":500,"failed_logins":0,"country":"US","latitude":40.7128,"longitude":-74.0060}'

          code=$(curl -sS -o /tmp/ingest.json -w '%{http_code}'             -H "X-API-Key: $ML_API_KEY"             -H "Idempotency-Key: ci-event-1"             -H 'Content-Type: application/json'             -d "$payload"             http://127.0.0.1:5000/api/ml/events)
          test "$code" = "202"

          processed=false
          for _ in $(seq 1 60); do
            curl -fsS               -H "X-API-Key: $ML_API_KEY"               http://127.0.0.1:5000/api/ml/events/ci-event-1               > /tmp/status.json
            if python -c 'import json; import sys; sys.exit(0 if json.load(open("/tmp/status.json"))["status"] == "processed" else 1)'; then
              processed=true
              break
            fi
            sleep 2
          done
          test "$processed" = "true"

          duplicate_code=$(curl -sS -o /tmp/duplicate.json -w '%{http_code}'             -H "X-API-Key: $ML_API_KEY"             -H "Idempotency-Key: ci-event-1"             -H 'Content-Type: application/json'             -d "$payload"             http://127.0.0.1:5000/api/ml/events)
          test "$duplicate_code" = "200"
          python -c 'import json; assert json.load(open("/tmp/duplicate.json"))["deduplicated"] is True'

          curl -fsS http://127.0.0.1:5000/metrics | grep -q 'soc_events_total'

      - name: Show stack logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v --remove-orphans

  ml-governance:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mlops.txt

      - name: Install MLOps Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mlops.txt

      - name: Reproduce Training Run
        run: PYTHONPATH=. python scripts/run_ml_experiment.py

      - name: Validate Governance Policy
        run: PYTHONPATH=. pytest -q tests/test_ml_governance.py tests/test_ml_pipeline.py

      - name: Generate Drift Evidence
        run: PYTHONPATH=. python scripts/run_drift_report.py

      - name: Generate SHAP Evidence
        run: PYTHONPATH=. python scripts/run_shap_report.py

      - name: Verify Governance Artifacts
        run: |
          test -s ml/reports/ml_metrics_v2.json
          test -s ml/reports/model_manifest_v2.json
          test -s ml/reports/drift_report.json
          test -s ml/reports/shap_feature_importance.json
          python - <<'PY'
          import json
          from ml.feature_extractor import FEATURE_COLUMNS
          manifest = json.load(open("ml/reports/model_manifest_v2.json"))
          shap = json.load(open("ml/reports/shap_feature_importance.json"))
          assert manifest["feature_columns"] == FEATURE_COLUMNS
          assert manifest["promotion_gate"]["passed"] is True
          assert {item["feature"] for item in shap["features"]} == set(FEATURE_COLUMNS)
          PY

  operations-validation:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Prometheus config and rules
        run: |
          docker run --rm \
            -v "$PWD/observability:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.15.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("observability/grafana/dashboards").glob("*.json"):
              payload = json.loads(path.read_text())
              assert payload.get("uid")
              assert payload.get("panels")
              ids = [panel["id"] for panel in payload["panels"]]
              assert len(ids) == len(set(ids))
              for panel in payload["panels"]:
                  for target in panel.get("targets", []):
                      expr = target.get("expr", "")
                      for forbidden in ("source_ip", "event_id", "api_key", "incident_id"):
                          assert forbidden not in expr
          PY

      - name: Validate observability contract
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q tests/test_observability.py

      - name: Validate Compose service graph
        run: |
          docker compose config --quiet
          docker compose config --services | grep -qx app
          docker compose config --services | grep -qx worker
          docker compose config --services | grep -qx prometheus
          docker compose config --services | grep -qx grafana
          docker compose config --services | grep -qx tempo
          docker compose config --services | grep -qx otel-collector
