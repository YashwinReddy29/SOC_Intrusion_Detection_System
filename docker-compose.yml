services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soc
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: apache/kafka-native:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092           --create --if-not-exists --topic soc.events.v1           --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092           --create --if-not-exists --topic soc.events.dlq.v1           --partitions 3 --replication-factor 1           --config retention.ms=604800000

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-jwt-change-me}
      ML_API_KEY: ${ML_API_KEY:-development-ingestion-key}
      DATABASE_URL: postgresql+psycopg://soc:soc-local-only@postgres:5432/soc
      REDIS_URL: redis://redis:6379/0
      EVENT_INGEST_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENT_TOPIC: soc.events.v1
      KAFKA_DLQ_TOPIC: soc.events.dlq.v1
      KAFKA_CONSUMER_GROUP: soc-detector-v1
      SOCKETIO_CORS_ORIGINS: http://127.0.0.1:5000,http://localhost:5000
      TRUST_PROXY_HEADERS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "scripts/run_event_consumer.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-jwt-change-me}
      ML_API_KEY: ${ML_API_KEY:-development-ingestion-key}
      DATABASE_URL: postgresql+psycopg://soc:soc-local-only@postgres:5432/soc
      REDIS_URL: redis://redis:6379/0
      EVENT_INGEST_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENT_TOPIC: soc.events.v1
      KAFKA_DLQ_TOPIC: soc.events.dlq.v1
      KAFKA_CONSUMER_GROUP: soc-detector-v1
      SOCKETIO_CORS_ORIGINS: http://127.0.0.1:5000,http://localhost:5000
      TRUST_PROXY_HEADERS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
