services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soc
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mlflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: apache/kafka-native:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic soc.events.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic soc.events.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg://mlflow:mlflow-local-only@mlflow-db:5432/mlflow
      - --artifacts-destination
      - /mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - mlflow:5000,localhost:5001,127.0.0.1:5001
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "127.0.0.1:5001:5000"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  app:
    image: soc-platform:local
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-jwt-change-me}
      ML_API_KEY: ${ML_API_KEY:-development-ingestion-key}
      DATABASE_URL: postgresql+psycopg://soc:soc-local-only@postgres:5432/soc
      REDIS_URL: redis://redis:6379/0
      EVENT_INGEST_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENT_TOPIC: soc.events.v1
      KAFKA_DLQ_TOPIC: soc.events.dlq.v1
      KAFKA_CONSUMER_GROUP: soc-detector-v1
      SOCKETIO_CORS_ORIGINS: http://127.0.0.1:5000,http://localhost:5000
      TRUST_PROXY_HEADERS: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: soc-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  worker:
    image: soc-platform:local
    command: ["python", "scripts/run_event_consumer.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-jwt-change-me}
      ML_API_KEY: ${ML_API_KEY:-development-ingestion-key}
      DATABASE_URL: postgresql+psycopg://soc:soc-local-only@postgres:5432/soc
      REDIS_URL: redis://redis:6379/0
      EVENT_INGEST_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_EVENT_TOPIC: soc.events.v1
      KAFKA_DLQ_TOPIC: soc.events.dlq.v1
      KAFKA_CONSUMER_GROUP: soc-detector-v1
      SOCKETIO_CORS_ORIGINS: http://127.0.0.1:5000,http://localhost:5000
      TRUST_PROXY_HEADERS: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: soc-detector-worker
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped

  trainer:
    profiles: ["mlops"]
    build:
      context: .
      dockerfile: Dockerfile.mlops
    command: ["python", "scripts/run_ml_experiment.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: soc-intrusion-detection
      MLFLOW_MODEL_NAME: soc-isolation-forest
    depends_on:
      mlflow:
        condition: service_healthy

  drift-report:
    profiles: ["mlops"]
    build:
      context: .
      dockerfile: Dockerfile.mlops
    command: ["python", "scripts/run_drift_report.py"]

  shap-report:
    profiles: ["mlops"]
    build:
      context: .
      dockerfile: Dockerfile.mlops
    command:
      - /bin/sh
      - -ec
      - python scripts/run_ml_experiment.py && python scripts/run_shap_report.py

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-db-data:
  mlflow-artifacts:
  redis-data:
  kafka-data:
  tempo-data:
  prometheus-data:
  grafana-data:
