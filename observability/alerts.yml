groups:
  - name: soc-platform-slo
    rules:
      - alert: SOCDependencyUnavailable
        expr: soc_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SOC dependency is unavailable"
          description: "{{ $labels.dependency }} has failed readiness for more than 2 minutes."

      - alert: SOCHighHTTPErrorRatio
        expr: |
          (
            sum(rate(soc_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(soc_http_requests_total[5m])), 0.001)
          ) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SOC API 5xx ratio exceeds 1%"

      - alert: SOCHighHTTPP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(soc_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SOC API p95 latency exceeds 250 ms"

      - alert: SOCHighDetectionP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(soc_detection_duration_seconds_bucket[5m])) by (le)
          ) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SOC detector p95 latency exceeds 100 ms"

      - alert: SOCKafkaConsumerLagHigh
        expr: max(soc_kafka_consumer_lag) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SOC detector Kafka lag exceeds 100 records"
          description: "Partition {{ $labels.partition }} on {{ $labels.topic }} is falling behind."

      - alert: SOCKafkaWorkerDown
        expr: up{job="soc-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SOC Kafka detector worker metrics endpoint is down"
