global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: soc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]

  - job_name: soc-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
